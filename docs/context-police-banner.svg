<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="ui-monospace,monospace" shape-rendering="crispEdges">
  <!-- ===== context-police pixel banner ===== -->
  <!-- dark arcade bg with neon/coin/violet palette; built from <rect> cells (no external fonts) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160c28"/>
      <stop offset="1" stop-color="#0a0612"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffce4a"/>
      <stop offset="1" stop-color="#e0a81f"/>
    </linearGradient>
  </defs>
  <rect width="560" height="200" rx="16" fill="url(#bg)"/>
  <!-- scanline overlay -->
  <g opacity="0.05" fill="#ffffff">
    <rect y="0" width="560" height="2"/><rect y="8" width="560" height="2"/><rect y="16" width="560" height="2"/>
    <rect y="24" width="560" height="2"/><rect y="32" width="560" height="2"/><rect y="40" width="560" height="2"/>
    <rect y="48" width="560" height="2"/><rect y="56" width="560" height="2"/><rect y="64" width="560" height="2"/>
    <rect y="72" width="560" height="2"/><rect y="80" width="560" height="2"/><rect y="88" width="560" height="2"/>
    <rect y="96" width="560" height="2"/><rect y="104" width="560" height="2"/><rect y="112" width="560" height="2"/>
    <rect y="120" width="560" height="2"/><rect y="128" width="560" height="2"/><rect y="136" width="560" height="2"/>
    <rect y="144" width="560" height="2"/><rect y="152" width="560" height="2"/><rect y="160" width="560" height="2"/>
    <rect y="168" width="560" height="2"/><rect y="176" width="560" height="2"/><rect y="184" width="560" height="2"/>
    <rect y="192" width="560" height="2"/>
  </g>

  <!-- twinkly stars -->
  <g fill="#b06bff" opacity="0.8">
    <rect x="40" y="28" width="4" height="4"/><rect x="510" y="40" width="4" height="4"/>
    <rect x="300" y="22" width="4" height="4"/><rect x="470" y="150" width="4" height="4"/>
  </g>
  <g fill="#46e8c8" opacity="0.7">
    <rect x="80" y="160" width="4" height="4"/><rect x="350" y="170" width="4" height="4"/><rect x="525" y="100" width="4" height="4"/>
  </g>

  <!-- ===== little pixel POLICE CAR (7px grid, translate to position) ===== -->
  <g transform="translate(40,84)">
    <!-- siren light bar -->
    <rect x="35" y="-14" width="7" height="7" fill="#ff5a3c"/>
    <rect x="42" y="-14" width="7" height="7" fill="#46e8c8"/>
    <!-- light glow -->
    <rect x="32" y="-21" width="6" height="6" fill="#ff5a3c" opacity="0.45"/>
    <rect x="46" y="-21" width="6" height="6" fill="#46e8c8" opacity="0.45"/>

    <!-- roof / cabin -->
    <rect x="21" y="-7" width="42" height="7" fill="#f3e9ff"/>
    <rect x="28" y="-7" width="28" height="7" fill="#7aa2ff"/> <!-- windshield -->
    <!-- body top -->
    <rect x="7" y="0" width="70" height="14" fill="#f3e9ff"/>
    <!-- door seam + star badge on the door -->
    <rect x="35" y="2" width="2" height="10" fill="#a991c9"/>
    <!-- star (coin) badge -->
    <rect x="44" y="3" width="3" height="3" fill="#ffce4a"/>
    <rect x="41" y="6" width="9" height="3" fill="#ffce4a"/>
    <rect x="43" y="9" width="5" height="3" fill="#ffce4a"/>
    <!-- lower body / bumper -->
    <rect x="0" y="14" width="84" height="7" fill="#b06bff"/>
    <!-- wheels -->
    <rect x="14" y="21" width="14" height="7" fill="#22143b"/>
    <rect x="17" y="24" width="8" height="4" fill="#a991c9"/>
    <rect x="56" y="21" width="14" height="7" fill="#22143b"/>
    <rect x="59" y="24" width="8" height="4" fill="#a991c9"/>
    <!-- headlight -->
    <rect x="78" y="3" width="6" height="5" fill="#ffce4a"/>
  </g>

  <!-- ===== speech of authority: a tiny "STOP — budget!" sign ===== -->
  <g transform="translate(150,52)">
    <rect x="0" y="0" width="14" height="14" fill="#ff5a3c"/>
    <rect x="3" y="3" width="8" height="2" fill="#160c28"/>
    <rect x="3" y="6" width="8" height="2" fill="#160c28"/>
    <rect x="3" y="9" width="8" height="2" fill="#160c28"/>
  </g>

  <!-- ===== TITLE: CONTEXT POLICE, drawn as pixel block letters ===== -->
  <!-- We use a bold pixel-ish text run; monospace renders, but to be font-safe the mascot above carries the art. -->
  <text x="178" y="92" font-size="34" font-weight="800" fill="#f3e9ff" letter-spacing="1">CONTEXT</text>
  <text x="178" y="132" font-size="34" font-weight="800" fill="#46e8c8" letter-spacing="1">POLICE</text>
  <!-- little pixel siren beside the title (font-free) -->
  <g transform="translate(330,108)">
    <rect x="0" y="0" width="9" height="9" fill="#ff5a3c"/>
    <rect x="11" y="0" width="9" height="9" fill="#46e8c8"/>
    <rect x="2" y="11" width="16" height="5" fill="#7aa2ff"/>
  </g>
  <!-- subtitle -->
  <text x="180" y="158" font-size="13" fill="#a991c9" letter-spacing="0.5">patrolling the skills-catalog token budget</text>

  <!-- coin tally in the corner -->
  <g transform="translate(498,150)">
    <rect x="0" y="0" width="10" height="10" rx="5" fill="url(#badge)"/>
    <rect x="3" y="3" width="4" height="4" fill="#160c28"/>
    <text x="16" y="9" font-size="11" fill="#ffce4a" font-weight="700">−48%</text>
  </g>
</svg>
